name: 新規コラム記事の自動生成

on:
  schedule:
    - cron: '0 0 * * 1'    # 毎週月曜 09:00 JST
    - cron: '0 6 * * 1'    # 月曜15:00 JST(朝が混雑で失敗した場合の自動再挑戦)
    - cron: '0 12 * * 1'   # 月曜21:00 JST(同上。生成済みの日は自動スキップ)
    - cron: '0 0 * * 4'    # 毎週木曜 09:00 JST
    - cron: '0 6 * * 4'    # 木曜15:00 JST(自動再挑戦)
    - cron: '0 12 * * 4'   # 木曜21:00 JST(自動再挑戦)
  workflow_dispatch: {}    # 手動実行も可能

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: 未レビューの記事PRが残っていないか確認
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OPEN=$(gh pr list --repo ${{ github.repository }} --label article-review --state open --json number --jq 'length')
          echo "open=$OPEN" >> "$GITHUB_OUTPUT"
          if [ "$OPEN" != "0" ]; then
            echo "未レビューの記事PRが ${OPEN} 件あります。レビュー(OK/NG返信)が済むまで新規生成はお休みします。"
          fi

      - name: Python セットアップ
        if: steps.gate.outputs.open == '0'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 記事を生成（失敗時は2分おきに最大5回自動リトライ）
        if: steps.gate.outputs.open == '0'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          for i in 1 2 3 4 5; do
            echo "===== 試行 $i/5 ====="
            if python3 pipeline/generate_article.py; then
              exit 0
            fi
            if [ "$i" -lt 5 ]; then
              echo "失敗。120秒待って再試行します..."
              sleep 120
            fi
          done
          echo "5回試しても失敗しました。次のスケジュール実行で自動再挑戦します。"
          exit 1

      - name: 生成ファイル名を取得
        id: meta
        run: |
          FNAME=$(cat pipeline/last_generated.txt 2>/dev/null || true)
          echo "fname=$FNAME" >> "$GITHUB_OUTPUT"
          SLUG="${FNAME#column-}"; SLUG="${SLUG%.html}"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "preview=https://medical-git-art-${SLUG}-hacchan1102s-projects.vercel.app/${FNAME}" >> "$GITHUB_OUTPUT"
          if [ -z "$FNAME" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi

      - name: Pull Request を作成（マージ＝公開承認）
        if: steps.meta.outputs.skip != 'true'
        id: pr
        uses: peter-evans/create-pull-request@v6
        with:
          branch: art-${{ steps.meta.outputs.slug }}
          commit-message: "新規コラム: ${{ steps.meta.outputs.fname }}"
          title: "【要レビュー】新規コラム: ${{ steps.meta.outputs.fname }}"
          body: |
            自動生成された新規コラムです。

            📱 **記事プレビュー（本番と同じ見た目・作成後1分ほどで有効）**
            ${{ steps.meta.outputs.preview }}

            - 成分名・数値・受診目安を薬剤師として確認してください
            - 問題なければ **Merge → Vercelが自動デプロイ（公開）** されます
            - 修正が必要なら、このブランチのファイルをGitHub上で直接編集してからMergeしてください
            - 公開後は Search Console で URL 検査 → インデックス登録をリクエストしてください
          labels: article-review

      - name: レビュー用メールを送信
        if: steps.meta.outputs.skip != 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "【レビュー依頼】新規コラム: ${{ steps.meta.outputs.fname }}"
          to: ${{ secrets.GMAIL_USERNAME }}
          from: みんなの薬剤師 記事パイプライン
          body: |
            新しいコラム記事が生成されました。

            ▼ 記事プレビュー（本番と同じ見た目で読めます。届いてから1分ほどで有効）
            ${{ steps.meta.outputs.preview }}

            ▼ 承認（公開）する場合
            このメールにそのまま「OK」とだけ返信してください。
            1時間以内に自動で公開され、完了メールが届きます。
            （従来どおり下のPRを開いて Merge しても公開できます）
            ${{ steps.pr.outputs.pull-request-url }}

            ▼ 公開しない場合
            「NG」と返信してください。記事は公開されず破棄されます。

            ▼ 修正したい場合
            PRのブランチ上でファイルを編集し、そのあと「OK」返信 または Merge してください。

            ※ 成分名・数値・受診の目安は必ず薬剤師として確認をお願いします。
          attachments: ${{ steps.meta.outputs.fname }}
