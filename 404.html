<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ページが見つかりません｜みんなの薬剤師</title>
<meta name="description" content="お探しのページは見つかりませんでした。症状から市販薬を探すか、トップページからお進みください。">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#10B981">
<link rel="icon" type="image/png" href="assets/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#2563EB;--blue-d:#1D4ED8;--line:#06C755;--ink:#0F172A;--slate:#475569;--slate-l:#94A3B8}
body{font-family:'Noto Sans JP',sans-serif;color:var(--ink);line-height:1.7;background:linear-gradient(160deg,#F5F9FF 0%,#EFF6FF 45%,#ECFDF5 100%);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem 1.5rem}
.mark{width:64px;height:64px;margin:0 auto 1.5rem;object-fit:contain}
.code{font-size:5rem;font-weight:900;line-height:1;background:linear-gradient(120deg,var(--blue),var(--line));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-2px}
h1{font-size:1.5rem;font-weight:900;margin:.6rem 0 .4rem}
p.lead{color:var(--slate);max-width:32rem;margin:0 auto 2rem}
.actions{display:flex;flex-wrap:wrap;gap:.8rem;justify-content:center;margin-bottom:2.5rem}
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.75rem 1.5rem;border-radius:100px;font-weight:700;text-decoration:none;font-size:.95rem;transition:transform .2s}
.btn:hover{transform:translateY(-2px)}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 10px 24px -10px rgba(37,99,235,.6)}
.btn-line{background:var(--line);color:#fff;box-shadow:0 10px 24px -10px rgba(6,199,85,.6)}
.btn-ghost{background:#fff;color:var(--ink);border:1px solid #E2E8F0}
.symptoms{max-width:34rem;margin:0 auto}
.symptoms h2{font-size:.85rem;font-weight:700;color:var(--slate-l);letter-spacing:.05em;margin-bottom:.9rem}
.sym-grid{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center}
.sym-grid a{background:#fff;border:1px solid #E2E8F0;border-radius:100px;padding:.45rem 1rem;font-size:.88rem;font-weight:500;color:var(--slate);text-decoration:none;transition:all .2s}
.sym-grid a:hover{color:var(--blue);border-color:var(--blue)}
</style>
</head>
<body>
  <img class="mark" src="assets/logo-icon.png" alt="みんなの薬剤師">
  <div class="code">404</div>
  <h1>ページが見つかりませんでした</h1>
  <p class="lead">お探しのページは移動または削除された可能性があります。以下から目的の情報をお探しください。</p>

  <div class="actions">
    <a class="btn btn-primary" href="/">トップページへ</a>
    <a class="btn btn-ghost" href="/medicines.html">市販薬を探す</a>
    <a class="btn btn-line" href="https://lin.ee/yQA2ON5" target="_blank" rel="noopener">LINEで相談する</a>
  </div>

  <div class="symptoms">
    <h2>症状から探す</h2>
    <div class="sym-grid">
      <a href="/headache.html">頭痛</a>
      <a href="/cold.html">風邪</a>
      <a href="/allergy.html">花粉症</a>
      <a href="/stomach.html">胃痛・胃もたれ</a>
      <a href="/constipation.html">便秘</a>
      <a href="/diarrhea.html">下痢</a>
      <a href="/throat.html">喉の痛み</a>
      <a href="/fatigue.html">疲労・倦怠感</a>
      <a href="/column.html">コラム</a>
    </div>
  </div>
<style>
.line-float-btn{position:fixed;right:1.1rem;bottom:1.1rem;z-index:200;display:inline-flex;align-items:center;gap:.5rem;background:linear-gradient(145deg,#06C755,#05B14C);color:#fff!important;font-weight:700;font-size:.9rem;padding:.8rem 1.25rem;border-radius:100px;text-decoration:none;box-shadow:0 10px 28px -8px rgba(6,199,85,.55);animation:lineFloatPulse 2.6s ease-in-out infinite;transition:transform .2s}
.line-float-btn:hover{transform:translateY(-3px)}
.line-float-btn .lfb-ic{display:grid;place-items:center;width:20px;height:20px;border-radius:6px;background:rgba(255,255,255,.28);font-size:.72rem;font-weight:800;flex-shrink:0}
@keyframes lineFloatPulse{0%,100%{box-shadow:0 10px 28px -8px rgba(6,199,85,.55)}50%{box-shadow:0 10px 34px -6px rgba(6,199,85,.85)}}
@media(max-width:480px){.line-float-btn{padding:.72rem 1rem;font-size:.82rem;right:.8rem;bottom:.8rem}}
</style>
<a href="https://lin.ee/yQA2ON5" target="_blank" rel="noopener" class="line-float-btn" aria-label="LINEで気軽に相談する">
  <span class="lfb-ic">L</span><span>気軽に相談</span>
</a>
</body>
</html>
